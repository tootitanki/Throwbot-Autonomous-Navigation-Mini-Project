# Sensor MODELS used in the study. Every number below is an ASSUMED model parameter chosen to be in the range of
# common hobby/entry-level modules; none of them is a measurement of a specific physical device.
# 'mount' is the sensor pose in base_link (x forward, z up). hfov/fov in radians.
lidar:                       # 360 deg 2D lidar (same sensor as the original package)
  kind: scan
  gz_sensor: gpu_lidar
  samples: 360
  min_angle: -3.14159
  max_angle: 3.14159
  range_min: 0.12
  range_max: 8.0
  rate_hz: 10.0
  noise_std: 0.01
  mount: {x: 0.05, z: 0.09}
  costmap: {layer: voxel, data_type: LaserScan, topic: /sensor/scan, obstacle_max_range: 6.0, raytrace_max_range: 8.0}
lidar_fwd87:                 # ABLATION: identical lidar but only the forward 87 deg (the depth camera's field of view)
  kind: scan
  gz_sensor: gpu_lidar
  samples: 87
  min_angle: -0.7592
  max_angle: 0.7592
  range_min: 0.12
  range_max: 8.0
  rate_hz: 10.0
  noise_std: 0.01
  mount: {x: 0.05, z: 0.09}
  costmap: {layer: voxel, data_type: LaserScan, topic: /sensor/scan, obstacle_max_range: 6.0, raytrace_max_range: 8.0}
depth:                       # forward depth camera, rendered depth image -> point cloud
  kind: depth
  gz_sensor: depth_camera
  width: 320
  height: 240
  hfov: 1.5184               # 87 deg
  range_min: 0.3
  range_max: 6.0
  rate_hz: 15.0
  noise_std: 0.01
  mount: {x: 0.20, z: 0.10}
  costmap: {layer: voxel, data_type: PointCloud2, topic: /sensor/depth/points, obstacle_max_range: 5.5, raytrace_max_range: 6.0, min_obstacle_height: 0.10}
depth160:                    # SAME depth camera (FOV, range, rate, noise) at 160x120: 4x smaller cloud (transport diagnostic variant)
  kind: depth
  gz_sensor: depth_camera
  width: 160
  height: 120
  hfov: 1.5184               # 87 deg
  range_min: 0.3
  range_max: 6.0
  rate_hz: 15.0
  noise_std: 0.01
  mount: {x: 0.20, z: 0.10}
  costmap: {layer: voxel, data_type: PointCloud2, topic: /sensor/depth/points, obstacle_max_range: 5.5, raytrace_max_range: 6.0, min_obstacle_height: 0.10}
ultrasonic:                  # APPROXIMATION: 9 narrow rays in a 15 deg cone, minimum taken as one range reading
  kind: range
  gz_sensor: gpu_lidar
  samples: 9
  min_angle: -0.1309
  max_angle: 0.1309
  range_min: 0.02
  range_max: 4.0
  rate_hz: 10.0
  noise_std: 0.003
  mount: {x: 0.21, z: 0.0}
  costmap: {layer: range, topic: /sensor/range}
